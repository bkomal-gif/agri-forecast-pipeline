[project]
name = "agri-forecast-pipeline"
version = "0.1.0"
description = "Forecast-to-farmer-message pipeline: ingest, QC, rule-based advisories, multi-channel payloads"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
